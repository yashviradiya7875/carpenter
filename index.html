<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0b12" />
    <meta name="description" content="Sign in to Carpenter Pro, your material visualization studio." />
    <title>Carpenter Pro | Material Studio</title>
    <script>
      // Apply the saved (or OS) theme before first paint; ThemeProvider takes over after load.
      (function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('carpenter-pro.theme')
          theme = saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } catch (error) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
