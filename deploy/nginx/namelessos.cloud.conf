# namelessos.cloud — the React bundle.
#
# Written HTTP-only on purpose: `certbot --nginx` adds the 443 server block,
# the certificate paths and the HTTP->HTTPS redirect when provision.sh runs it.
# Keeping TLS out of version control means this file never goes stale against
# the certificates actually on the box.

server {
    listen 80;
    listen [::]:80;
    server_name namelessos.cloud www.namelessos.cloud;

    # Symlink maintained by release.sh — a deploy flips it atomically.
    root /var/www/namelessos.cloud/current;
    index index.html;

    access_log /var/log/nginx/namelessos.cloud.access.log;
    error_log  /var/log/nginx/namelessos.cloud.error.log;

    # Vite emits content-hashed filenames, so assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2|png|jpg|jpeg|webp|svg|ico|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must NOT be cached: it is what points at the new hashed
    # bundles, so a cached copy pins visitors to the previous release.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Single-page app: every unknown path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. {
        deny all;
    }
}
